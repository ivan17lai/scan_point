# Builds the Windows target on every push, and publishes a downloadable
# release when a version tag is pushed.
#
# This exists because the machine this project is developed on is a Mac, and
# Windows cannot be cross-compiled from macOS — the native half (the low-level
# keyboard hook in windows/runner/kiosk_lock.cpp, and the CMake wiring around
# it) would otherwise ship having never been through a compiler. The Windows
# runner template sets /W4 /WX, so any warning in that C++ fails the build,
# which is exactly the signal wanted here.
#
# Two ways to get the binary out, for two different audiences:
#   - Build artifact: attached to every run, but GitHub requires the downloader
#     to be signed in, even on a public repository.
#   - Release asset: created on a `v*` tag, downloadable by anyone with the
#     link and no account at all. This is the one to hand to a marshal who is
#     about to carry a laptop up a hill.

name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      # Needed by `gh release create` in the publish step below. If that step
      # ever fails with 403, check Settings → Actions → Workflow permissions.
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the project is developed against. Floating on
          # "stable" would turn an upstream release into a surprise CI failure
          # on an unrelated commit.
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release
        run: flutter build windows --release

      - name: Bundle the Visual C++ runtime
        shell: pwsh
        run: |
          # Flutter does not ship the MSVC runtime with a Windows build. A
          # developer machine and this runner both have it because Visual
          # Studio installed it, so the gap only shows up on a clean machine —
          # as "MSVCP140.dll is missing", after the folder has already been
          # carried up a hill. Microsoft permits redistributing these DLLs
          # next to the application, which is what keeps "unzip and run" true.
          $crt = Get-ChildItem `
            -Path "C:\Program Files*\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" `
            -Directory -ErrorAction SilentlyContinue |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) {
            throw "找不到 VC++ redistributable 資料夾,無法打包執行階段"
          }
          Write-Host "使用: $($crt.FullName)"
          Copy-Item "$($crt.FullName)\*.dll" -Destination build/windows/x64/runner/Release/ -Force

      - name: Check build output
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          Get-ChildItem $release
          # Anything missing here produces a zip that fails only on the target
          # machine, so each one is checked rather than assumed.
          $required = @(
            "scan_point.exe",
            "flutter_windows.dll",
            "msvcp140.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll"
          )
          $missing = $required | Where-Object { -not (Test-Path "$release/$_") }
          if ($missing) {
            throw "缺少必要檔案: $($missing -join ', ')"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: scan_point-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath "scan_point-windows-x64-$env:GITHUB_REF_NAME.zip"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Notes live in a file rather than inline: a PowerShell here-string
          # treats the backtick as an escape character, which fights with
          # Markdown, and its terminator is column-sensitive inside a YAML
          # block. Keeping them separate also means the text can be edited
          # without touching CI.
          gh release create "$env:GITHUB_REF_NAME" `
            "scan_point-windows-x64-$env:GITHUB_REF_NAME.zip" `
            --title "scan_point $env:GITHUB_REF_NAME" `
            --notes-file .github/release-notes.md
